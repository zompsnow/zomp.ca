<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>zomp.ca</title>
    <meta name="description" content="Something is growing.">

    <!-- open graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="zomp.ca">
    <meta property="og:description" content="Something is growing.">
    <meta property="og:url" content="https://zomp.ca/">
    <meta property="og:image" content="https://zomp.ca/logo.png">

    <!-- helps identify the site -->
    <meta property="og:site_name" content="zomp.ca">

    <style>
        :root {
            --zomp: #6f8f4e;
            --zomp-bright: #8aaa62;
            --black: #000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--black);
            color: var(--zomp);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            width: min(240px, 50vw);
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        p {
            margin: 1rem 0 0;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.65;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 0.75rem;
            letter-spacing: 0.1em;
            opacity: 0.35;
        }
    </style>
</head>

<body>
    <main>
        <img class="logo" src="/logo.png" alt="Zomp">

        <h1>zomp.ca</h1>

        <p>Something is growing.</p>
    </main>

    <footer>
        &copy; 2026 Zomp
    </footer>
</body>
</html>
